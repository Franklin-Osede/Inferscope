[project]
name = "inferscope"
version = "0.1.0"
description = "Reproducible benchmark of a single-GPU vLLM deployment on Kubernetes"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["infra/tests"]
pythonpath = ["infra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
